name: Check extension
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:runtime
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - run: npm run build:cli:light
        env:
          PAGE_REVIEW_BUN: bun
      - run: npm run test:cli-bundle
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: page-review-unpacked
          path: dist/page-review/
