<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>评注记录 · Page Review</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="library.css" />
    <script src="core.js" defer></script>
    <script src="library.js" defer></script>
  </head>
  <body>
    <header class="workspace-header">
      <strong><img class="brand-icon" src="icons/48.png" alt="" width="28" height="28" />网页评注 <span>评注记录</span></strong
      ><button class="icon-btn" data-action="settings" aria-label="连接设置">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.65"
        >
          <path d="M4 7h8m4 0h4M4 17h4m4 0h8" />
          <circle cx="14" cy="7" r="2" />
          <circle cx="10" cy="17" r="2" />
        </svg>
      </button>
    </header>
    <main class="library-shell">
      <div class="history-filters">
        <div class="date-filter">
          <button id="history-date" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="date-menu">
            <span>全部时间</span><span class="date-chevron" aria-hidden="true"></span>
          </button>
          <div id="date-menu" role="menu" aria-label="记录时间" hidden>
            <button type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-range="all">全部时间</button>
            <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-range="today">今天</button>
            <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-range="week">最近 7 天</button>
            <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-range="custom">自定义时间…</button>
          </div>
        </div>
        <input
          id="search"
          autocomplete="off"
          type="search"
          aria-label="搜索网页或评注"
          placeholder="搜索网页或评注"
        />
        <div id="custom-date" hidden>
          <input
            id="date-from"
            type="datetime-local"
            aria-label="开始时间"
          /><span>至</span
          ><input id="date-to" type="datetime-local" aria-label="结束时间" />
        </div>
      </div>
      <p id="history-error" class="inline-error" role="alert" hidden></p>
      <div class="history-count">
        <span id="count"></span
        ><button class="text-button" data-action="refresh">刷新</button>
      </div>
      <div id="app">正在读取…</div>
    </main>
    <dialog id="detail-dialog" class="drawer" aria-label="评注详情"></dialog>
    <dialog id="access-dialog" aria-label="连接设置"></dialog>
    <dialog id="delete-dialog" aria-labelledby="delete-heading" aria-describedby="delete-scope">
      <h2 id="delete-heading">删除这条评注？</h2>
      <p id="delete-scope"></p>
      <p id="delete-progress" role="status"></p>
      <div class="dialog-actions">
        <button class="btn" data-action="keep">保留</button
        ><button class="btn danger" data-action="confirm-delete">删除</button>
      </div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
